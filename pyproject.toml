[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "undercards-card-eval"
version = "0.2.0"
description = "Shared-policy semantic card replacement evaluation"
readme = "card_eval/README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
research = ["scipy>=1.10,<2"]

[project.scripts]
card-eval = "card_eval.__main__:main"

[tool.setuptools]
packages = ["card_eval"]

[tool.setuptools.package-data]
card_eval = ["_engine/*.py", "_engine/*.json", "data/*.json", "models/*.npz", "models/*.json", "README.md", "PROTOCOL.md"]
